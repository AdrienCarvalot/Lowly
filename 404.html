<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Lowly Apps</title>
  <meta name="description" content="The page you requested could not be found.">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon/appstore.ico">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5fb;
      --panel: rgba(255, 255, 255, 0.82);
      --text: #17141f;
      --muted: #6b6578;
      --border: rgba(23, 20, 31, 0.1);
      --accent: #5226de;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0c18;
        --panel: rgba(20, 17, 32, 0.82);
        --text: #f3f0fa;
        --muted: #b7afc6;
        --border: rgba(255, 255, 255, 0.08);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(82, 38, 222, 0.14), transparent 35%),
        var(--bg);
      color: var(--text);
    }
    .panel {
      width: min(100%, 640px);
      padding: 40px 32px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 18px 60px rgba(13, 10, 24, 0.14);
      text-align: center;
      backdrop-filter: blur(20px);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      line-height: 1;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    a:hover {
      transform: translateY(-1px);
    }
    .primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 12px 24px rgba(82, 38, 222, 0.22);
    }
    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>404</h1>
    <p>The page you requested could not be found.</p>
    <div class="actions">
      <a class="primary" href="/">Back to Lowly Apps</a>
      <a class="secondary" href="mailto:contact@lowly.fr">Contact us</a>
    </div>
  </main>
</body>
</html>
